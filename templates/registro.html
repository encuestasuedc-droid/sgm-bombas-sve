<!DOCTYPE html>
<html>
<head>
    <title>Registrar mantenimiento</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>

<div class="container">

    <div class="card">

        <form method="POST">

            <p>Fecha</p>
            <input type="date" name="fecha" required>

            <p>Bomba</p>
            <select name="bomba">

                {% for i in range(1,24) %}
                <option>C{{i}}</option>
                {% endfor %}

            </select>

            <p>Componente roto</p>
            <select name="componente">

                <option>Comando eléctrico</option>
                <option>Cable y enchufe</option>
                <option>Motor</option>
                <option>Turbina</option>
                <option>Cabezal</option>
                <option>Rulemán</option>
                <option>Estopada</option>
                <option>Pintado</option>
                <option>Ruedas</option>

            </select>

            <p>Responsable</p>
            <input type="text" name="responsable">

            <p>Costo</p>
            <input type="number" name="costo">

            <p>Observaciones</p>
            <textarea name="observacion"></textarea>

            <br><br>

            <button type="submit">
                Guardar mantenimiento
            </button>

        </form>

    </div>

    <div class="card">

        /
            🏠 Volver al inicio
        </a>

    </div>

</div>

</body>
</html>
