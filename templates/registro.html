<!DOCTYPE html>
<html>
<head>
    <title>Registrar Mantenimiento</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>
    <h1>� Bombas SVE</p>
</header>

<div class="container">

    <div class="card">

        <form method="POST">

            <label><b>📅 Fecha</b></label>
            <input type="date"
                   name="fecha"
                   required>

            <label><b>🔧 Bomba</b></label>
            <select name="bomba">

                {% for i in range(1,24) %}
                <option>C{{i}}</option>
                {% endfor %}

            </select>

            <label><b>⚙️ Componente roto</b></label>
            <select name="componente">

                <option>Comando eléctrico</option>
                <option>Cable y enchufe</option>
                <option>Motor</option>
                <option>Turbina</option>
                <option>Cabezal</option>
                <option>Rulemán</option>
                <option>Estopada</option>
                <option>Pintado</option>
                <option>Ruedas</option>

            </select>

            <label><b>👤 Responsable</b></label>
            <input type="text"
                   name="responsable"
                   placeholder="Nombre del responsable">

            <label><b>💰 Costo ($)</b></label>
            <input type="number"
                   name="costo"
                   placeholder="Ingrese el costo">

            <label><b>📝 Observaciones</b></label>
            <textarea name="observacion"
                      rows="5"
                      placeholder="Detalle de la reparación..."></textarea>

            <br><br>

            <button type="submit">
                💾 Guardar Mantenimiento
            </button>

        </form>

    </div>

    <div class="card">

        /
