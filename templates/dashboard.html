<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        
        <!-- Botón Menú Principal -->
        <div class="card">
            <a href="/">🏠 Menú principal</a>
        </div>

        <div class="card">
            <h2>Total Reparaciones</h2>
            <h1>{{ total }}</h1>
        </div>

        <div class="card">
            <h2>Costo Total</h2>
            <h1>${{ costo_total }}</h1>
        </div>

        <div class="card">
            <a href="/">🏠 Volver al Inicio</a>
        </div>

    </div>
</body>
</html>
