<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SGM Bombas SVE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f4ef;
        }

        .inicio-pantalla {
            position: relative;
            display: grid;
            grid-template-columns: 48% 52%;
            min-height: 100vh;
            overflow: hidden;
            background-color: #faf8f4;
        }

        /* Panel izquierdo */

        .inicio-contenido {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 55px 6vw 95px;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(223, 190, 219, 0.30),
                    transparent 32%
                ),
                #faf8f4;
        }

        .inicio-contenido::after {
            content: "";
            position: absolute;
            z-index: -1;
            left: -320px;
            bottom: -510px;
            width: 730px;
            height: 660px;

            background:
                linear-gradient(
                    145deg,
                    #4d0639,
                    #771052
                );

            border: 14px solid #dfbedb;
            border-radius: 50%;
            transform: rotate(-15deg);

            pointer-events: none;
        }

        .etiqueta-sistema {
            align-self: flex-start;
            margin-bottom: 22px;
            padding: 7px 14px;

            color: #ffffff;
            background-color: #6b123c;
            border-radius: 30px;

            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-sve {
            display: block;
            width: min(350px, 88%);
            height: auto;
            margin-bottom: 24px;

            object-fit: contain;
            object-position: left center;
        }

        .descripcion {
            max-width: 530px;
            margin: 0;

            color: #624957;
            font-size: 17px;
            line-height: 1.6;
        }

        /* Menú principal */

        .menu-links {
            position: relative;
            z-index: 10;

            display: grid;
            gap: 15px;

            width: min(570px, 100%);
            margin-top: 36px;
        }

        .boton-menu {
            display: flex;
            align-items: center;
            gap: 18px;

            width: 100%;
            min-height: 91px;
            padding: 16px 20px;

            color: #590744;
            font-family: Arial, Helvetica, sans-serif;
            text-align: left;

            background-color: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(89, 7, 68, 0.16);
            border-radius: 18px;

            box-shadow:
                0 12px 30px rgba(70, 15, 52, 0.13);

            cursor: pointer;

            transition:
                transform 0.20s ease,
                color 0.20s ease,
                background 0.20s ease,
                box-shadow 0.20s ease;
        }

        .boton-menu:hover
