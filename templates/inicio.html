<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>SGM Bombas SVE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        body.inicio-app {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f0eb;
        }
        .portada-sve {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background-image: linear-gradient(
                90deg,
                rgba(255, 253, 250, 0.93) 0%,
                rgba(255, 253, 250, 0.84) 48%,
                rgba(255, 253, 250, 0.20) 100%
            ), url("{{ url_for('static', filename='img/sve57.png') }}");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }
        .portada-sve::before {
            content: "";
            position: absolute;
            top: -190px;
            right: -180px;
            width: 620px;
            height: 440px;
            background: linear-gradient(
                135deg,
                #761052,
                #4b0437
            );
            border-radius: 48%;
            transform: rotate(13deg);
            opacity: 0.95;
        }
        .portada-sve::after {
            content: "";
            position: absolute;
            left: -320px;
            bottom: -440px;
            width: 850px;
            height: 760px;
            background: linear-gradient(
                145deg,
                #4d0639,
                #791054
            );
            border: 16px solid rgba(221, 185, 215, 0.85);
            border-radius: 50%;
            transform: rotate(-14deg);
        }
        .portada-contenido {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: min(1180px, 88%);
            min-height: calc(100vh - 80px);
            margin: auto;
            padding: 40px 0;
        }
        .marca-superior {
            max-width: 760px;
            color: #590744;
        }
        .marca-sistema {
            display: inline-block;
            margin-bottom: 20px;
            padding: 7px 14px;
            color: white;
            background-color: #6b123c;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .titulo-principal {
            margin: 0;
            color: #590744;
            font-size: clamp(44px, 6.5vw, 86px);
            font-weight: 400;
            line-height: 0.94;
            letter-spacing: -2px;
        }
        .titulo-principal strong {
            display: block;
            font-weight: 900;
        }
        .subtitulo-principal {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 28px;
            color: #6b1754;
            font-size: clamp(14px, 2vw, 21px);
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .subtitulo-principal::before,
        .subtitulo-principal::after {
            content: "";
            flex: 1;
            max-width: 155px;
            height: 2px;
            background-color: #73105a;
        }
        .menu-principal {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin: 45px 0 30px;
        }
        .boton-menu {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 110px;
            padding: 22px;
            color: #590744;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(89, 7, 68, 0.16);
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(61, 8, 46, 0.18);
            backdrop-filter: blur(10px);
            transition: transform 0.22s ease, color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
        }
        .boton-menu:hover {
            color: white;
            background: linear-gradient(
                135deg,
                #761052,
                #4f063a
            );
            transform: translateY(-6px);
            box-shadow: 0 24px 50px rgba(61, 8, 46, 0.3); /* CORRECCIÓN: Se cerró la regla truncada */
        }
    </style>
</head>
