<!DOCTYPE html>
<html>
<head>
    <title>Historial</title>
 <link rel="stylesheet"
href="{{ url_for('static', filename='css/style
</head>
<body>

<header>
    <h1>Historial de Mantenimientos</h1>
</header>

<div class="container">

    <form method="GET">

        <label>Filtrar Bomba</label>

        <select name="bomba">

            <option value="">Todas</option>

            {% for i in range(1,24) %}
            <option value="C{{i}}">
                C{{i}}
            </option>
            {% endfor %}

        </select>

        <button type="submit">
            Filtrar
        </button>

    </form>

    <br>

    {% for r in registros %}

    <div class="card">

        <h3>🔧 {{ r.bomba }}</h3>

        <p><b>Fecha:</b> {{ r.fecha }}</p>

        <p><b>Componente:</b> {{ r.componente }}</p>

        <p><b>Responsable:</b> {{ r.responsable }}</p>

        <p><b>Costo:</b> ${{ r.costo }}</p>

        <p><b>Observación:</b> {{ r.observacion }}</p>

    </div>

    {% endfor %}

    <a        Volver
    </a>

</div>

</body>
</html>
